<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audit & Network Tool</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Test Scenarios, Systems & DW Network Tool</h1>
        <p class="subtitle">Global Internal Audit DA</p> </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="input-group">
                <h3>📝 Test Scenarios Extraction</h3> 
                <input type="text" id="audit_id_1" placeholder="Please input Audit ID">
                <button onclick="runPython(1)">Extract</button>
            </div>
            <div class="input-group">
                <h3>💻 Systems Extraction</h3>
                <input type="text" id="audit_id_2" placeholder="Please input Audit ID">
                <button onclick="runPython(2)">Extract</button>
            </div>
            <div class="input-group">
                <h3>🌐 DW Network Tool</h3>
                <input type="text" id="ae_input" placeholder="Please Input AE">
                <button onclick="runPython(3)">Extract</button>
            </div>
        </aside>

        <main class="content-area">
            <div class="top-tabs">
                <button class="tab-btn" onclick="showSource('qcp2')">QCP2 File</button>
                <button class="tab-btn" onclick="showSource('network')">DW Network File</button>
            </div>
            <div id="display-table-container">
                <table id="result-table">
                    <thead><tr id="table-header"></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </main>

        <aside class="control-panel">
            <button class="action-btn clear" onclick="clearResults()">Clear Result</button>
            <button class="action-btn export" onclick="exportToExcel()">Export Result</button>
        </aside>
    </div>

        <script>
        // 用一个变量记住当前表格里的数据，方便导出时发送给后端
        let currentTableData = [];

        async function runPython(scriptId) {
            const auditId = document.querySelector(`#audit_id_${scriptId}`)?.value || document.querySelector('#ae_input').value;
            
            if (!auditId) {
                alert("Please input a value before extracting!");
                return;
            }

            const response = await fetch('/run_script', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: scriptId, audit_id: auditId})
            });
            const data = await response.json();
            
            // 如果后端返回了错误信息，弹出提示
            if (data.length > 0 && data[0].Error) {
                alert("Error: " + data[0].Error);
                return;
            }

            currentTableData = data; // 更新当前数据
            renderTable(data);
        }

        async function showSource(type) {
            const response = await fetch(`/get_source_data?source=${type}`);
            const data = await response.json();
            currentTableData = data; // 更新当前数据
            renderTable(data);
        }

        function renderTable(data) {
            const header = document.getElementById('table-header');
            const body = document.getElementById('table-body');
            header.innerHTML = ''; body.innerHTML = '';
            
            if (data.length > 0) {
                // 生成表头
                Object.keys(data[0]).forEach(key => {
                    header.innerHTML += `<th>${key}</th>`;
                });
                // 生成表格内容
                data.forEach(row => {
                    let tr = '<tr>';
                    Object.values(row).forEach(val => tr += `<td>${val}</td>`);
                    body.innerHTML += tr + '</tr>';
                });
            } else {
                 body.innerHTML = '<tr><td colspan="100%" style="text-align:center;">No data found</td></tr>';
            }
        }

        function clearResults() {
            document.getElementById('table-header').innerHTML = '';
            document.getElementById('table-body').innerHTML = '';
            currentTableData = []; // 清空数据
        }

        // 新增的导出 Excel 核心逻辑
        async function exportToExcel() {
            if (currentTableData.length === 0) {
                alert("There is no data to export! Please run an extraction first.");
                return;
            }

            // 给用户一个正在下载的反馈
            const exportBtn = document.querySelector('.action-btn.export');
            exportBtn.textContent = "Exporting...";
            
            try {
                // 把当前数据发送给后端的 /export 接口
                const response = await fetch('/export', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(currentTableData)
                });

                if (response.ok) {
                    // 将后端返回的文件流 (Blob) 转换成浏览器的下载链接
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    
                    // 创建一个隐藏的 <a> 标签并模拟点击下载
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'Audit_Network_Result.xlsx'; // 下载的文件名
                    document.body.appendChild(a);
                    a.click();
                    
                    // 清理痕迹
                    a.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                } else {
                    alert("Failed to export Excel.");
                }
            } catch (error) {
                console.error("Export error:", error);
                alert("An error occurred during export.");
            } finally {
                // 恢复按钮文字
                exportBtn.textContent = "Export Result";
            }
        }

    </script>
</body>
</html>
